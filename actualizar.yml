name: Actualizar noticias

on:
  schedule:
    - cron: "0 */2 * * *"   # cada 2 horas (hora UTC)
  workflow_dispatch:         # botón para correrlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Recolectar y reescribir noticias
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build_news.py

      - name: Guardar cambios
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet || git commit -m "Actualizar noticias"
          git push
